<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registrar Préstamo</title>
<link rel="stylesheet" href="css/prestamo.css">
</head>
<body>

<div class="container">
  <h2>📚 REGISTRAR PRÉSTAMO</h2>

  <form id="formPrestamo">
    <label>Usuario (Matrícula):</label>
    <input type="text" id="matricula" placeholder="Ej. 20311045" required>

    <div class="paso">
      <span class="num">1</span>
      <label>Selecciona la categoría</label>
      <select id="categoria" required>
        <option value="">Selecciona una categoría</option>
        <option value="TID">TID</option>
        <option value="IAEV">IAEV</option>
        <option value="CIA">CIA</option>
        <option value="IMA">IMA</option>
        <option value="IBIO">IBIO</option>
        <option value="Lectura General Español">Lectura General Español</option>
        <option value="Lectura General Inglés">Lectura General Inglés</option>
      </select>
    </div>

    <div class="paso">
      <span class="num">2</span>
      <label>Selecciona el libro</label>
      <select id="libro" required>
        <option value="">Primero selecciona una categoría</option>
      </select>
    </div>

    <label>Fecha de préstamo:</label>
    <input type="date" id="fechaPrestamo" required>

    <label>Fecha de devolución:</label>
    <input type="date" id="fechaDevolucion" required>

    <button type="submit" class="btn-guardar">Guardar préstamo</button>
  </form>

  <a href="index.html" class="btn-regresar">← Volver al inicio</a>
</div>

<script src="js/prestamos.js"></script>
</body>
</html>
