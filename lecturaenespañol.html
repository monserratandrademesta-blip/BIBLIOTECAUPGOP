<!DOCTYPE html>
<html lang="es">

<head>

    <!-- Codificación UTF-8 para interpretar correctamente acentos y la letra ñ -->
    <meta charset="UTF-8">

    <!-- Configuración del viewport para que el diseño sea totalmente responsivo en móviles -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">


    <!-- Nombre que se muestra en la pestaña superior del navegador -->
    <title>LEC.GEN.ESP</title>


    <!-- Hoja de estilos CSS específica para la sección de Lectura General en Español -->
    <link rel="stylesheet" href="../css/lecturaenespañol.css">

</head>



<!-- El atributo data-categoria pasa el nombre exacto de la categoría a libros.js para consultar MySQL -->
<body data-categoria="LECTURA GENERAL EN ESPAÑOL">


<!-- Contenedor general que estructura la maquetación en dos bloques principales -->
<div class="contenedor">


    <!-- Columna izquierda: Información, encabezados y el contenedor dinámico de libros -->
    <div class="texto">


        <!-- Abreviatura o sigla representativa de la sección -->
        <h1>LEC.GEN.ESP</h1>


        <!-- Título completo de la categoría de lectura -->
        <h3>
            Lectura General en Español
        </h3>


        <!-- Mensaje de bienvenida contextual para el estudiante -->
        <p>
            Bienvenido a la sección LEC.GEN.ESP de la biblioteca.
            Aquí encontrarás información y material de consulta
            para apoyar tus actividades académicas.
        </p>



        <!-- Subtítulo que encabeza el listado de libros -->
        <h2>Libros disponibles</h2>



        <!-- Contenedor vacío donde la función de libros.js renderizará las tarjetas desde la base de datos -->
        <div id="listaLibros" class="lista-libros"></div>



        <!-- Enlace con estilo de botón para retornar a la cuadrícula del catálogo -->
        <a href="catalogo.html" class="boton">
            Regresar al Catálogo
        </a>


    </div>




    <!-- Columna derecha: Recurso visual de la sección -->
    <div class="imagen">


        <!-- Portada o ilustración correspondiente a la sección en español -->
        <img src="../img/lcge.jpeg" alt="Lectura General en Español">


    </div>


</div>



<!-- Script ejecutable que consulta la API/Base de datos y llena el elemento #listaLibros -->
<script src="../js/libros.js"></script>


</body>

</html>
